name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  archipielago:
    name: archipielago package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install
        run: pip install numpy pandas scikit-learn pyyaml pytest
      - name: Unit tests
        working-directory: ArChIPelago_code
        run: pytest tests -v

  r2-analysis:
    name: R2 tables, figures and numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install (versions the tracked outputs were built with)
        run: |
          command -v pdftotext || for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y poppler-utils && break; sleep 60; done
          command -v pdftotext
          pip install pandas==2.3.0 numpy==1.26.4 scipy==1.13.1 matplotlib==3.5.2 openpyxl==3.1.5 pyyaml==6.0 scikit-learn==1.1.2 pytest
      - name: Recompute the tables and numbers from their sources
        env:
          ARCHI_STAGE: H5
        run: pytest tests --ignore=tests/server_checks -v
